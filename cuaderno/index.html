<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cuaderno</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuaderno">
<meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Cuaderno con Apple Pencil, carpetas, conversión de manuscrito a texto, sesiones en vivo con transcripción y secretario con Claude.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app" data-view="home">

  <!-- ===== Barra lateral ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Cuaderno</span>
      </div>
      <button class="icon-btn" id="btn-sidebar-close" title="Ocultar">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Buscar en todo" autocomplete="off">
    </div>

    <nav class="nav">
      <button class="nav-item" data-nav="home">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>Hoy</span>
      </button>
      <button class="nav-item" data-nav="agenda">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Agenda</span>
      </button>
      <button class="nav-item" data-nav="live">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span>Sesión en vivo</span>
        <span class="dot-rec" id="nav-rec-dot" hidden></span>
      </button>
    </nav>

    <div class="tree-head">
      <span>Carpetas</span>
      <button class="icon-btn small" id="btn-new-root-folder" title="Nueva carpeta">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="tree" id="tree"></div>

    <div class="sidebar-foot">
      <button class="nav-item" id="btn-settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Ajustes</span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ===== Columna de lista ===== -->
  <section class="list-col" id="list-col">
    <div class="list-head">
      <button class="icon-btn" id="btn-sidebar-open" title="Carpetas">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h2 class="list-title" id="list-title">Notas</h2>
      <div class="spacer"></div>
      <button class="icon-btn" id="btn-folder-menu" title="Carpeta">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
      <button class="btn primary" id="btn-new-note">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nota</span>
      </button>
    </div>
    <div class="list" id="note-list"></div>
  </section>

  <!-- ===== Área principal ===== -->
  <main class="main" id="main">
    <!-- Hoy -->
    <section class="view view-home" id="view-home"></section>

    <!-- Agenda -->
    <section class="view view-agenda" id="view-agenda"></section>

    <!-- Editor de nota -->
    <section class="view view-note" id="view-note">
      <header class="note-head">
        <button class="icon-btn only-narrow" id="btn-back-list" title="Volver">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <input class="note-title" id="note-title" placeholder="Sin título" spellcheck="false">
        <div class="note-meta" id="note-meta"></div>
        <button class="icon-btn" id="btn-note-menu" title="Más">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
      </header>

      <div class="toolbar" id="toolbar">
        <div class="tool-group">
          <button class="tool" data-tool="pen" title="Pluma"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M13 7l3 3"/></svg></button>
          <button class="tool" data-tool="highlighter" title="Subrayador"><svg viewBox="0 0 24 24"><path d="M9 18l-4 1 1-4L16 5l3 3z"/><path d="M4 22h16"/></svg></button>
          <button class="tool" data-tool="eraser" title="Goma"><svg viewBox="0 0 24 24"><path d="M7 20h10M5 15l9-9 5 5-6 6H8z"/></svg></button>
          <button class="tool" data-tool="text" title="Texto escrito a máquina"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></svg></button>
        </div>
        <div class="tool-group colors" id="colors">
          <button class="swatch" data-color="#1f1b14" style="--c:#1f1b14" title="Tinta"></button>
          <button class="swatch" data-color="#1d4ed8" style="--c:#1d4ed8" title="Azul"></button>
          <button class="swatch" data-color="#b91c1c" style="--c:#b91c1c" title="Rojo"></button>
          <button class="swatch" data-color="#15803d" style="--c:#15803d" title="Verde"></button>
          <button class="swatch" data-color="#b45309" style="--c:#b45309" title="Ámbar"></button>
        </div>
        <div class="tool-group widths" id="widths">
          <button class="width" data-width="1.5"><i style="--w:3px"></i></button>
          <button class="width" data-width="2.5"><i style="--w:5px"></i></button>
          <button class="width" data-width="4"><i style="--w:8px"></i></button>
        </div>
        <div class="tool-group">
          <button class="tool" id="btn-undo" title="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
          <button class="tool" id="btn-redo" title="Rehacer"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
        </div>
        <div class="spacer"></div>
        <button class="btn accent" id="btn-convert" title="Convertir manuscrito a texto">
          <svg viewBox="0 0 24 24"><path d="M4 19c3-6 5-9 8-13 3 4 5 7 8 13"/><path d="M8 15h8"/></svg>
          <span>Convertir a texto</span>
        </button>
        <button class="btn" id="btn-add-page" title="Añadir página">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Página</span>
        </button>
      </div>

      <div class="pages" id="pages"></div>
    </section>

    <!-- Sesión en vivo -->
    <section class="view view-live" id="view-live"></section>
  </main>

  <!-- ===== Diálogos ===== -->
  <dialog id="dlg-settings" class="sheet">
    <form method="dialog" class="sheet-body">
      <header><h3>Ajustes</h3><button class="icon-btn" value="cancel" formnovalidate><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <section class="settings">
        <h4>Claude</h4>
        <label>Clave de API de Anthropic
          <input type="password" id="set-apikey" placeholder="sk-ant-…" autocomplete="off">
          <small>Se guarda solo en este iPad. Consíguela en console.anthropic.com.</small>
        </label>
        <label>Modelo
          <select id="set-model">
            <option value="claude-fable-5-1">Claude Fable 5.1 · el más capaz</option>
            <option value="claude-opus-5-5">Claude Opus 5.5 · equilibrado</option>
            <option value="claude-sonnet-5-5">Claude Sonnet 5.5 · rápido</option>
          </select>
        </label>
        <label>Cómo quieres que te trate el secretario
          <input type="text" id="set-persona" placeholder="Ej.: Soy Felipe, director de RR. HH.; trabajo con Fundación Juan XXIII y Nine Sapiens.">
          <small>Contexto breve que Claude tendrá en cuenta en actas y resúmenes.</small>
        </label>

        <h4>Escritura</h4>
        <label class="row"><span>Solo Apple Pencil dibuja (el dedo desplaza)</span><input type="checkbox" id="set-pencil-only"></label>
        <label>Papel
          <select id="set-paper">
            <option value="ruled">Rayado</option>
            <option value="grid">Cuadrícula</option>
            <option value="dots">Punteado</option>
            <option value="blank">Liso</option>
          </select>
        </label>

        <h4>Sesión en vivo</h4>
        <label>Idioma de la transcripción
          <select id="set-lang">
            <option value="es-ES">Español (España)</option>
            <option value="es-MX">Español (México)</option>
            <option value="pt-BR">Português (Brasil)</option>
            <option value="pt-PT">Português (Portugal)</option>
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="ca-ES">Català</option>
            <option value="fr-FR">Français</option>
            <option value="de-DE">Deutsch</option>
            <option value="it-IT">Italiano</option>
          </select>
        </label>
        <label>Resumen automático cada
          <select id="set-auto-summary">
            <option value="0">Nunca</option>
            <option value="3">3 minutos</option>
            <option value="5" selected>5 minutos</option>
            <option value="10">10 minutos</option>
          </select>
        </label>

        <h4>Calendarios</h4>
        <label>ID de cliente de Google (opcional)
          <input type="text" id="set-google-client" placeholder="xxxx.apps.googleusercontent.com" autocomplete="off">
          <small>Para conectar Google Calendar en directo. Sin esto, importa archivos .ics (iCloud, Outlook, Google).</small>
        </label>

        <h4>Datos</h4>
        <div class="btn-row">
          <button type="button" class="btn" id="btn-export">Exportar copia</button>
          <button type="button" class="btn" id="btn-import">Importar copia</button>
          <input type="file" id="file-import" accept="application/json,.json" hidden>
        </div>
        <small id="storage-info"></small>
      </section>
      <footer><button class="btn primary" value="ok" id="btn-settings-save">Guardar</button></footer>
    </form>
  </dialog>

  <dialog id="dlg-convert" class="sheet">
    <div class="sheet-body">
      <header><h3>Manuscrito a texto</h3><button class="icon-btn" id="dlg-convert-close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="convert-body">
        <div class="convert-status" id="convert-status">Leyendo tu letra…</div>
        <textarea id="convert-text" rows="10" spellcheck="true"></textarea>
      </div>
      <footer class="btn-row">
        <button class="btn" id="convert-keep">Insertar y conservar tinta</button>
        <button class="btn primary" id="convert-replace">Insertar y limpiar tinta</button>
      </footer>
    </div>
  </dialog>

  <dialog id="dlg-prompt" class="sheet small">
    <form method="dialog" class="sheet-body">
      <header><h3 id="prompt-title">Nombre</h3></header>
      <div class="convert-body"><input type="text" id="prompt-input" autocomplete="off"></div>
      <footer class="btn-row">
        <button class="btn" value="cancel" formnovalidate>Cancelar</button>
        <button class="btn primary" value="ok" id="prompt-ok">Aceptar</button>
      </footer>
    </form>
  </dialog>

  <dialog id="dlg-move" class="sheet small">
    <div class="sheet-body">
      <header><h3>Mover a carpeta</h3><button class="icon-btn" id="dlg-move-close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="move-list" id="move-list"></div>
    </div>
  </dialog>

  <div class="menu" id="ctx-menu" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
